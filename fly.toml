# !!! CHANGE THE APP NAME BELOW. It must be GLOBALLY UNIQUE across all of Fly.io !!!
# (it becomes https://<name>.fly.dev). Use lowercase letters, numbers and dashes.
app = 'flock-CHANGE-ME'

# Pick the Fly region closest to your church (run `fly platform regions` to list them,
# for example 'iad' for Virginia or 'lhr' for London). Replace the placeholder.
primary_region = 'CHANGE-ME'

# IMPORTANT: Flock uses ONE SQLite file on ONE volume, so it must run exactly ONE machine.
# NEVER scale to 2 machines (`fly scale count 2`): each would have its own, different database.

[build]
  dockerfile = 'Dockerfile'

# Only non-secret values belong here. Google sign-in (optional) needs two secrets, set with
#   fly secrets set FLOCK_GOOGLE_CLIENT_ID=... FLOCK_GOOGLE_CLIENT_SECRET=...
[env]
  NODE_ENV = 'production'
  FLOCK_PORT = '8080'
  FLOCK_DB = '/data/flock.db'
  FLOCK_SECURE_COOKIES = '1'
  # Fly's proxy sets Fly-Client-IP; without this every visitor shares one IP for the sign-in limits.
  FLOCK_TRUST_PROXY = '1'

[mounts]
  source = 'flock_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Never sleep: a sleeping machine would make Sunday morning slow.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
