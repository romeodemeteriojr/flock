name: Deploy

# Manual only. Pressing "Run workflow" IS the approval step (the free GitHub
# plan has no environment approvals).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v1.2.3" >&2
            exit 1
          fi
      # Major version tags; pinning to full commit SHAs is stricter and Dependabot keeps them updated.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Check version matches tag
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/check-version.js --tag "$TAG"
      - name: Test suite
        run: node --test
      - name: Check production config
        run: node scripts/check-config.js --production
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Pre-deploy volume snapshot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP=$(sed -n "s/^app = '\(.*\)'.*/\1/p" fly.toml)
          VOLUME_NAME=$(sed -n "s/^ *source = '\(.*\)'.*/\1/p" fly.toml)
          flyctl volumes list -a "$APP" --json > volumes.json
          VOLUME_ID=$(VOLUME_NAME="$VOLUME_NAME" node -e "
            const v = JSON.parse(require('fs').readFileSync('volumes.json', 'utf8'));
            const m = v.find((x) => x.name === process.env.VOLUME_NAME);
            if (m) console.log(m.id);
          ")
          if [ -z "$VOLUME_ID" ]; then
            echo "No volume named $VOLUME_NAME found. Refusing to deploy without a snapshot." >&2
            exit 1
          fi
          if ! OUT=$(flyctl volumes snapshots create "$VOLUME_ID" -a "$APP" 2>&1); then
            echo "$OUT" >&2
            # A volume no machine has used yet holds no data (first deploy), so there is nothing to lose.
            if printf '%s' "$OUT" | grep -q 'uninitialized volume'; then
              echo "The volume has never been used (first deploy), so there is nothing to snapshot."
            else
              echo "Could not create a snapshot. Refusing to deploy." >&2
              exit 1
            fi
          fi
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false  # one machine, one database
      - name: Smoke test
        run: |
          APP=$(sed -n "s/^app = '\(.*\)'.*/\1/p" fly.toml)
          URL="https://$APP.fly.dev/api/health"
          for i in $(seq 1 24); do
            if curl -fsS --max-time 5 "$URL" > /dev/null; then
              echo "Healthy: $URL"
              exit 0
            fi
            echo "Waiting for $URL (attempt $i of 24)"
            sleep 5
          done
          echo "ROLLBACK: the new version did not become healthy within 2 minutes." >&2
          echo "ROLLBACK: 1. Run: flyctl releases -a $APP   (find the previous image)" >&2
          echo "ROLLBACK: 2. Run: flyctl deploy -a $APP --image <previous image>" >&2
          echo "ROLLBACK: Data problems? Restore the pre-deploy snapshot (see DEPLOY.md)." >&2
          exit 1
